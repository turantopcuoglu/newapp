name: nutri_guide
description: Personal wellness, nutrition, daily routines and health connections
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  intl: 0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  fl_chart: ^0.69.2
  http: ^1.2.2
  path_provider: ^2.1.5
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  health: ^13.3.2
  flutter_secure_storage: 10.0.0
  cryptography: ^2.9.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/recipes/
    - assets/moonlit/
    - assets/moods/
    - assets/food/
    - assets/materials/
    - assets/images/explore/
    - assets/images/onboarding/
    - assets/images/empty/
    - assets/images/scenes/
  fonts:
    - family: WellnessSans
      fonts:
        - asset: assets/fonts/roboto-light.ttf
          weight: 300
        - asset: assets/fonts/roboto-regular.ttf
          weight: 400
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
